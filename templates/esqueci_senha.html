<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recuperar senha | Gestão de Tempo</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/esqueci_senha.css') }}"
    >

</head>


<body>

    <div class="recuperacao-page">

        <div class="recuperacao-box">

            <div class="logo">
                ⏱️
            </div>

            <span class="tag">
                GESTÃO DE TEMPO
            </span>

            <h1>
                Esqueceu sua senha?
            </h1>

            <p class="descricao">
                Informe o e-mail cadastrado e vamos
                encaminhar você para redefinir sua senha.
            </p>


            <form
                method="POST"
                action="{{ url_for('esqueci_senha') }}"
            >

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao-continuar"
                >
                    Continuar
                    <span>→</span>
                </button>

            </form>


            <div class="voltar-login">

                <a href="{{ url_for('login') }}">
                    ← Voltar para o login
                </a>

            </div>

        </div>

    </div>

</body>

</html>
