<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Redefinir senha | Gestão de Tempo</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/redefinir_senha.css') }}"
    >

</head>


<body>

    <div class="redefinir-page">

        <div class="redefinir-box">

            <div class="logo">
                ⏱️
            </div>

            <span class="tag">
                GESTÃO DE TEMPO
            </span>

            <h1>
                Criar nova senha
            </h1>

            <p class="descricao">
                Digite uma nova senha para recuperar
                o acesso à sua conta.
            </p>


            <form
                method="POST"
                action="{{ url_for('redefinir_senha', token=token) }}"
            >

                <div class="campo">

                    <label for="senha">
                        Nova senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua nova senha"
                        minlength="6"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmar_senha">
                        Confirmar nova senha
                    </label>

                    <input
                        type="password"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        placeholder="Digite novamente sua senha"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao-redefinir"
                >

                    Salvar nova senha

                    <span>→</span>

                </button>

            </form>


            <div class="voltar-login">

                <a href="{{ url_for('login') }}">
                    ← Voltar para o login
                </a>

            </div>

        </div>

    </div>


    <script>

        const form = document.querySelector("form");

        form.addEventListener("submit", function(event) {

            const senha =
                document.getElementById("senha").value;

            const confirmar =
                document.getElementById("confirmar_senha").value;


            if (senha !== confirmar) {

                event.preventDefault();

                alert("As senhas não são iguais.");

            }

        });

    </script>

</body>

</html>
